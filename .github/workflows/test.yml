name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  blender:
    name: Blender ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.2.23"
            series: "Blender4.2"
          - version: "5.2.0"
            series: "Blender5.2"
    env:
      BLENDER_DIR: ${{ github.workspace }}/.blender-${{ matrix.version }}
      WRE_TEST_OUT: ${{ github.workspace }}/.wre-test-out
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ matrix.version }}-linux-x64-v1

      - name: Download Blender ${{ matrix.version }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BLENDER_DIR"
          curl -fsSL "https://download.blender.org/release/${{ matrix.series }}/blender-${{ matrix.version }}-linux-x64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$BLENDER_DIR"

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 libxxf86vm1 libxfixes3

      - name: Run test suite
        run: tests/run_tests.sh "$BLENDER_DIR/blender"

      - name: Validate extension package
        run: "$BLENDER_DIR/blender" --command extension validate web_ready_exporter

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-blender-${{ matrix.version }}
          path: ${{ env.WRE_TEST_OUT }}/**/*.report.md
          if-no-files-found: ignore
